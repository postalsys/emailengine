on:
    push:
        branches:
            - master

name: Deploy test instance and Docker image

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    deploy:
        name: Deploy Demo App
        runs-on: ubuntu-24.04
        timeout-minutes: 15

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24

            - name: Install SSH key
              uses: shimataro/ssh-key-action@v2
              with:
                  key: ${{ secrets.SSH_KEY }}
                  known_hosts: ${{ secrets.KNOWN_HOSTS }}

            - name: Deploy to server
              env:
                  TARGET_HOST_02: dev.emailengine.app
                  NODE_ENV: production
                  SERVICE_NAME: emailengine
              id: deploy
              run: |
                  echo $GITHUB_SHA > commit.txt
                  EE_COMMIT_HASH=$GITHUB_SHA ./update-info.sh
                  npm install --omit=dev
                  tar czf /tmp/${SERVICE_NAME}.tar.gz --exclude .git .
                  scp -o "UserKnownHostsFile=/dev/null" -o "StrictHostKeyChecking=no" /tmp/${SERVICE_NAME}.tar.gz deploy@${TARGET_HOST_02}:
                  ssh -o "UserKnownHostsFile=/dev/null" -o "StrictHostKeyChecking=no" deploy@$TARGET_HOST_02 "/opt/deploy.sh ${SERVICE_NAME}"

            - name: Deploy to demo server
              env:
                  TARGET_HOST_02: dev.emailengine.app
                  NODE_ENV: production
                  SERVICE_NAME: emailengine-demo
              id: deploy-demo
              run: |
                  echo $GITHUB_SHA > commit.txt
                  EE_COMMIT_HASH=$GITHUB_SHA ./update-info.sh
                  npm install --omit=dev
                  tar czf /tmp/${SERVICE_NAME}.tar.gz --exclude .git .
                  scp -o "UserKnownHostsFile=/dev/null" -o "StrictHostKeyChecking=no" /tmp/${SERVICE_NAME}.tar.gz deploy@${TARGET_HOST_02}:
                  ssh -o "UserKnownHostsFile=/dev/null" -o "StrictHostKeyChecking=no" deploy@$TARGET_HOST_02 "/opt/deploy.sh ${SERVICE_NAME}"

    docker:
        name: Build Docker Image (${{ matrix.arch }})
        # One job per architecture, each on a runner of that architecture. The arm64 leg used to be
        # emulated through QEMU on an x86 runner, where `npm ci` hit an illegal instruction and then
        # hung until the job timeout - reliably on any commit that touches package-lock.json, since
        # that busts the cached layer and forces the install to run in full. A native runner takes
        # the emulator out of the picture, and each image now gets smoke tested on the architecture
        # it was actually built for rather than only amd64.
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 30
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: amd64
                      platform: linux/amd64
                      runner: ubuntu-24.04
                    - arch: arm64
                      platform: linux/arm64
                      runner: ubuntu-24.04-arm

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Login to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Build locally and exercise the CLI BEFORE anything is published, so a broken image is
            # never pushed. The push below replays from this build's local layer cache, so paying
            # for the build twice costs almost nothing.
            - name: Build for smoke test (local)
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: ${{ matrix.platform }}
                  load: true
                  tags: emailengine:smoke-test
                  # Without a cache backend BuildKit starts cold on every run: setup-buildx-action
                  # creates a fresh builder on an ephemeral runner. The scope is per-architecture so
                  # the two legs cannot evict each other's entries.
                  cache-from: type=gha,scope=${{ matrix.arch }}

            - name: Smoke test the CLI inside the image
              run: bash .github/docker-smoke-test.sh emailengine:smoke-test

            # Pushed by digest and left untagged: a tag can only be attached once both architectures
            # exist, which is what the manifest job below does. Both registries are written here so
            # the blobs are already in place and the manifest job never has to copy them between
            # registries.
            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: ${{ matrix.platform }}
                  outputs: type=image,"name=docker.io/${{ github.repository }},ghcr.io/${{ github.repository }}",push-by-digest=true,name-canonical=true,push=true
                  cache-from: type=gha,scope=${{ matrix.arch }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

            - name: Export digest
              run: |
                  mkdir -p /tmp/digests
                  digest="${{ steps.build.outputs.digest }}"
                  touch "/tmp/digests/${digest#sha256:}"

            - name: Upload digest
              uses: actions/upload-artifact@v4
              with:
                  name: digests-${{ matrix.arch }}
                  path: /tmp/digests/*
                  if-no-files-found: error
                  retention-days: 1

    docker-manifest:
        name: Publish Docker Manifest
        runs-on: ubuntu-24.04
        needs: docker
        timeout-minutes: 15
        permissions:
            contents: read
            packages: write

        steps:
            - name: Download digests
              uses: actions/download-artifact@v4
              with:
                  path: /tmp/digests
                  pattern: digests-*
                  merge-multiple: true

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Login to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # :latest is owned by the release workflow (release.yaml) and always points at the
            # newest release; per-push dev builds from master are published as :edge instead.
            - name: Create and push the manifest list
              working-directory: /tmp/digests
              run: |
                  for image in "docker.io/${{ github.repository }}" "ghcr.io/${{ github.repository }}"; do
                      docker buildx imagetools create -t "${image}:edge" \
                          $(printf "${image}@sha256:%s " *)
                  done
