name: Run Tests

on:
    push:
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Skip CI for release-please's auto-generated release PR / branch: it only bumps the
    # version + CHANGELOG (no code change), so re-running the suite is wasted work. This is
    # gated per job rather than with [skip ci] in the release commit, because that text would
    # ride the squash-merge into master and skip the Manage Release run, breaking releases.
    license_check:
        name: License Compliance Check
        if: ${{ !startsWith(github.ref_name, 'release-please--') && !startsWith(github.head_ref, 'release-please--') }}
        runs-on: ubuntu-24.04
        # Service containers to run with `container-job`
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm install

            - name: Run License Checks
              run: |
                  npm run licenses

    lint:
        name: Lint
        if: ${{ !startsWith(github.ref_name, 'release-please--') && !startsWith(github.head_ref, 'release-please--') }}
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - name: Use Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm install
            - name: Run ESLint
              run: |
                  npm run lint

    unit:
        name: Unit Tests
        if: ${{ !startsWith(github.ref_name, 'release-please--') && !startsWith(github.head_ref, 'release-please--') }}
        timeout-minutes: 10
        runs-on: ubuntu-24.04
        # Service containers to run with `container-job`
        services:
            # Label used to access the service container
            redis:
                # Docker Hub image
                image: redis
                # Set health checks to wait until redis has started
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 6379:6379
        steps:
            - uses: actions/checkout@v6
            - name: Use Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm install
            - name: Run unit tests
              run: |
                  npm run test:unit
              env:
                  NODE_ENV: test
                  # account-revoke-on-delete-test.js runs against live Gmail when
                  # these are present and skips itself when they are not
                  GMAIL_API_PROJECT_ID: ${{ secrets.TEST_GMAIL_API_PROJECT_ID }}
                  GMAIL_API_CLIENT_ID: ${{ secrets.TEST_GMAIL_API_CLIENT_ID }}
                  GMAIL_API_CLIENT_SECRET: ${{ secrets.TEST_GMAIL_API_CLIENT_SECRET }}
                  GMAIL_API_SERVICE_EMAIL: ${{ secrets.TEST_GMAIL_API_SERVICE_EMAIL }}
                  GMAIL_API_SERVICE_CLIENT: ${{ secrets.TEST_GMAIL_API_SERVICE_CLIENT }}
                  GMAIL_API_SERVICE_KEY: ${{ secrets.TEST_GMAIL_API_SERVICE_KEY }}
                  GMAIL_API_ACCOUNT_EMAIL_1: ${{ secrets.TEST_GMAIL_API_ACCOUNT_EMAIL_1 }}
                  GMAIL_API_ACCOUNT_REFRESH_1: ${{ secrets.TEST_GMAIL_API_ACCOUNT_REFRESH_1 }}

    dovecot:
        # Live IMAP tier against a real IMAP4rev2 server (Dovecot 2.4 in Docker);
        # fully hermetic - needs no external mail accounts. See test/dovecot/README.md
        name: Live Dovecot Tests (IMAP4rev2)
        if: ${{ !startsWith(github.ref_name, 'release-please--') && !startsWith(github.head_ref, 'release-please--') }}
        timeout-minutes: 15
        runs-on: ubuntu-24.04
        services:
            redis:
                image: redis
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 6379:6379
        steps:
            - uses: actions/checkout@v6
            - name: Use Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm install
            - name: Run live Dovecot tests
              run: |
                  npm run test:dovecot
              env:
                  EENGINE_DOVECOT_PLATFORM: linux/amd64

    # Nothing else in CI bundles a binary, so pkg failures used to surface only when a release
    # was cut by hand on a Mac - the one place they are most expensive and least expected. Two
    # landed in a single day: a local helper named `require` in lib/openapi/ that pkg's module
    # walker choked on (undetectable by any test, since it runs correctly under Node), and a
    # dependency shipping a 0-byte ESM entry point that esbuild transformed to nothing. The
    # first sat undetected for four days and would have broken the next release outright.
    #
    # One target, unsigned, uncompressed. Signing and notarization need Apple credentials and
    # stay on the release machine; neither has any bearing on whether the bundle can be built.
    # The image ships an OS and a Node runtime we do not build, so its vulnerabilities arrive on
    # someone else's schedule rather than in a diff. Nothing watched that before, and the base pin
    # sat unmoved for 19 months while 21 Alpine CVEs accumulated behind it.
    #
    # Scoped to fixed HIGH/CRITICAL on purpose. An unfixed upstream CVE is not actionable here and
    # would block unrelated work at random; once a fix exists, a rebuild picks it up through
    # `apk upgrade`, or the base pin needs moving - both of which are on us.
    docker_scan:
        name: Docker Image Scan
        if: ${{ !startsWith(github.ref_name, 'release-please--') && !startsWith(github.head_ref, 'release-please--') }}
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v6

            # Single arch: the findings are properties of the base image and the lockfile, neither of
            # which differs per architecture, so scanning both legs would only double the runtime.
            - name: Build the image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: linux/amd64
                  load: true
                  tags: emailengine:scan

            - name: Scan for known vulnerabilities
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  image-ref: emailengine:scan
                  scanners: vuln
                  severity: HIGH,CRITICAL
                  ignore-unfixed: true
                  exit-code: '1'
                  format: table
              env:
                  # Trivy pulls its database from ghcr.io and is rate limited unauthenticated
                  TRIVY_USERNAME: ${{ github.actor }}
                  TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

    pkg_build:
        name: Binary Build (linux-x64, unsigned)
        if: ${{ !startsWith(github.ref_name, 'release-please--') && !startsWith(github.head_ref, 'release-please--') }}
        timeout-minutes: 20
        runs-on: ubuntu-24.04
        services:
            redis:
                image: redis
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 6379:6379
        steps:
            - uses: actions/checkout@v6
            - name: Use Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            # Unpinned on purpose, matching upload.sh: releases are built with whatever pkg is
            # current, so a pkg regression should fail here rather than mid-release.
            - name: Install pkg
              run: npm install -g @yao-pkg/pkg

            # The real production tree rather than a dev install. That distinction matters: the
            # empty-ESM-file failure only exists under `npm ci --omit=dev`, and
            # prepare-bundle-deps.sh, which works around it, only runs from this script.
            - name: Build the production source tree
              run: npm run build-source

            # Uncompressed - Brotli is minutes of CPU that changes nothing about the module
            # resolution this job exists to exercise. `--output` ignores the `outputPath` in
            # package.json, so it names the directory itself; ee-dist is already gitignored,
            # which keeps a stray 260 MB binary out of the way when running this locally.
            - name: Bundle a binary
              run: |
                  mkdir -p ee-dist
                  pkg --target node24-linux-x64 --output ee-dist/emailengine-ci package.json

            - name: Smoke test the CLI
              run: |
                  ./ee-dist/emailengine-ci --version
                  ./ee-dist/emailengine-ci help > /dev/null

            # Booting reaches past what the CLI touches: workers, and the views, static files and
            # lua scripts that are bundled as pkg assets rather than resolved as modules, so a
            # missing asset shows up here instead of in a released binary.
            - name: Boot the binary and check it serves
              env:
                  EENGINE_REDIS: redis://127.0.0.1:6379/12
                  EENGINE_PORT: 7311
                  EENGINE_HOST: 127.0.0.1
                  EENGINE_LOG_LEVEL: error
              run: |
                  ./ee-dist/emailengine-ci &
                  for i in $(seq 1 60); do
                      if curl -fsS http://127.0.0.1:7311/health >/dev/null 2>&1; then
                          echo "binary booted and served /health"
                          curl -fsS -o /dev/null http://127.0.0.1:7311/swagger.json
                          echo "generated document served"
                          exit 0
                      fi
                      sleep 2
                  done
                  echo "binary never became healthy" >&2
                  exit 1

    integration:
        name: Integration Tests
        if: ${{ !startsWith(github.ref_name, 'release-please--') && !startsWith(github.head_ref, 'release-please--') }}
        timeout-minutes: 15 # Increased timeout for Gmail API tests
        runs-on: ubuntu-24.04
        # Service containers to run with `container-job`
        services:
            # Label used to access the service container
            redis:
                # Docker Hub image
                image: redis
                # Set health checks to wait until redis has started
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 6379:6379
        steps:
            - uses: actions/checkout@v6
            - name: Use Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm install
            - name: Run integration tests
              run: |
                  npm run test:integration
              env:
                  NODE_ENV: test
                  GMAIL_API_PROJECT_ID: ${{ secrets.TEST_GMAIL_API_PROJECT_ID }}
                  GMAIL_API_CLIENT_ID: ${{ secrets.TEST_GMAIL_API_CLIENT_ID }}
                  GMAIL_API_CLIENT_SECRET: ${{ secrets.TEST_GMAIL_API_CLIENT_SECRET }}
                  GMAIL_API_SERVICE_EMAIL: ${{ secrets.TEST_GMAIL_API_SERVICE_EMAIL }}
                  GMAIL_API_SERVICE_CLIENT: ${{ secrets.TEST_GMAIL_API_SERVICE_CLIENT }}
                  GMAIL_API_SERVICE_KEY: ${{ secrets.TEST_GMAIL_API_SERVICE_KEY }}
                  GMAIL_API_ACCOUNT_EMAIL_1: ${{ secrets.TEST_GMAIL_API_ACCOUNT_EMAIL_1 }}
                  GMAIL_API_ACCOUNT_REFRESH_1: ${{ secrets.TEST_GMAIL_API_ACCOUNT_REFRESH_1 }}
                  GMAIL_API_ACCOUNT_EMAIL_2: ${{ secrets.TEST_GMAIL_API_ACCOUNT_EMAIL_2 }}
                  GMAIL_API_ACCOUNT_REFRESH_2: ${{ secrets.TEST_GMAIL_API_ACCOUNT_REFRESH_2 }}
                  GMAIL_SENDONLY_PROJECT_ID: ${{ secrets.GMAIL_SENDONLY_PROJECT_ID }}
                  GMAIL_SENDONLY_CLIENT_ID: ${{ secrets.GMAIL_SENDONLY_CLIENT_ID }}
                  GMAIL_SENDONLY_CLIENT_SECRET: ${{ secrets.GMAIL_SENDONLY_CLIENT_SECRET }}
                  GMAIL_SENDONLY_ACCOUNT_EMAIL: ${{ secrets.GMAIL_SENDONLY_ACCOUNT_EMAIL }}
                  GMAIL_SENDONLY_ACCOUNT_REFRESH: ${{ secrets.GMAIL_SENDONLY_ACCOUNT_REFRESH }}
                  OUTLOOK_SERVICE_CLIENT_ID: ${{ secrets.OUTLOOK_SERVICE_CLIENT_ID }}
                  OUTLOOK_SERVICE_TENANT_ID: ${{ secrets.OUTLOOK_SERVICE_TENANT_ID }}
                  OUTLOOK_SERVICE_CLIENT_SECRET: ${{ secrets.OUTLOOK_SERVICE_CLIENT_SECRET }}
                  OUTLOOK_SERVICE_ACCOUNT_EMAIL: ${{ secrets.OUTLOOK_SERVICE_ACCOUNT_EMAIL }}
                  GMAIL_SERVICE_POSTALSYS_CLIENT: ${{ secrets.GMAIL_SERVICE_POSTALSYS_CLIENT }}
                  GMAIL_SERVICE_POSTALSYS_SERVICE_EMAIL: ${{ secrets.GMAIL_SERVICE_POSTALSYS_SERVICE_EMAIL }}
                  GMAIL_SERVICE_POSTALSYS_KEY: ${{ secrets.GMAIL_SERVICE_POSTALSYS_KEY }}
                  GMAIL_SERVICE_POSTALSYS_ACCOUNT_EMAIL: ${{ secrets.GMAIL_SERVICE_POSTALSYS_ACCOUNT_EMAIL }}
                  GMAIL_WIF_SA_KEY: ${{ secrets.GMAIL_WIF_SA_KEY }}
                  GMAIL_WIF_AUDIENCE: ${{ secrets.GMAIL_WIF_AUDIENCE }}
                  GMAIL_WIF_ACCOUNT_EMAIL: ${{ secrets.GMAIL_WIF_ACCOUNT_EMAIL }}
