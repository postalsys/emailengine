on:
    push:
        branches:
            - master

permissions:
    contents: write
    pull-requests: write
    packages: write
    attestations: write
    id-token: write

name: Manage Release
jobs:
    release_please:
        name: Create or prepare release
        runs-on: ubuntu-latest
        outputs:
            major: ${{ steps.release.outputs.major }}
            minor: ${{ steps.release.outputs.minor }}
            patch: ${{ steps.release.outputs.patch }}
            release_created: ${{ steps.release.outputs.release_created }}
        steps:
            # Configured through release-please-config.json (manifest mode) rather than a
            # `release-type` input here - the two are mutually exclusive, and only the config
            # file can set `draft`, which the action exposes no input for. The release is drafted
            # so users never see a version whose binaries do not exist yet, and `force-tag-creation`
            # makes the tag anyway: GitHub withholds the tag for a draft, and upload.sh builds
            # from the tag (falling back to HEAD behind an interactive prompt without it).
            - uses: googleapis/release-please-action@v4
              id: release

    publish:
        name: Publish NPM package
        runs-on: ubuntu-latest
        needs: release_please
        # Fires as soon as release-please creates the release, which it does even though the
        # release is a draft - `release_created` reports the release object, not its visibility.
        #
        # Deliberately NOT deferred until the draft is published. Doing that would mean waiting
        # on a `release` event, and that event only exists because upload.sh publishes with a
        # real user's credentials: draft releases raise no event, and one raised inside Actions
        # by GITHUB_TOKEN never triggers a workflow. Several conditions all having to hold for a
        # publish to happen makes the failure mode a silent non-publication, discovered late.
        # Publishing here is one workflow run with nothing to choreograph.
        #
        # Publishing before the binaries exist is not shipping something broken: the npm package
        # is the Node source and works on its own - it does not carry the pkg binaries, so it
        # does not depend on the part of a release that can fail late.
        #
        # This job also has to stay in this file: npm trusted publishing (OIDC, which is why
        # there is no token secret) is bound to the repository AND the workflow filename.
        if: needs.release_please.outputs.release_created
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  registry-url: "https://registry.npmjs.org"
            - run: npm ci
            - run: npm publish --provenance --access public

    publish_docker:
        name: Publish Tagged Docker Image
        runs-on: ubuntu-latest
        needs: release_please
        if: needs.release_please.outputs.release_created
        # Multi-arch builds run the arm64 leg under QEMU emulation, which can
        # hang indefinitely on a misbehaving step. A normal build finishes in
        # ~4 minutes, so fail fast instead of burning the 6-hour default limit.
        timeout-minutes: 30
        steps:
            - run: echo version v${{needs.release_please.outputs.major}}.${{needs.release_please.outputs.minor}}.${{needs.release_please.outputs.patch}}

            - uses: actions/checkout@v6

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4
              with:
                  platforms: "arm64,arm"

            - name: Set up Docker Buildx
              id: buildx
              uses: docker/setup-buildx-action@v4
              with:
                  platforms: linux/amd64,linux/arm64/v8

            - name: Login to DockerHub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Login to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Build the amd64 image locally (no push) and smoke test the CLI BEFORE publishing, so a
            # broken image is never pushed to the tags users pull - the previous version smoke tested
            # the already-pushed image and could only detect the regression, not prevent shipping it.
            # This build replays from the same gha cache the multi-arch push below reuses.
            - name: Build for smoke test (amd64, local)
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: linux/amd64
                  load: true
                  tags: emailengine:smoke-test
                  cache-from: type=gha

            - name: Smoke test the CLI inside the image
              run: bash .github/docker-smoke-test.sh emailengine:smoke-test

            - name: Build and push
              id: build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: ${{ steps.buildx.outputs.platforms }}
                  push: true
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  tags: |
                      ${{ github.repository }}:latest
                      ${{ github.repository }}:v${{needs.release_please.outputs.major}}.${{needs.release_please.outputs.minor}}.${{needs.release_please.outputs.patch}}
                      ${{ github.repository }}:v${{needs.release_please.outputs.major}}.${{needs.release_please.outputs.minor}}
                      ${{ github.repository }}:v${{needs.release_please.outputs.major}}
                      ghcr.io/${{ github.repository }}:latest
                      ghcr.io/${{ github.repository }}:v${{needs.release_please.outputs.major}}.${{needs.release_please.outputs.minor}}.${{needs.release_please.outputs.patch}}
                      ghcr.io/${{ github.repository }}:v${{needs.release_please.outputs.major}}.${{needs.release_please.outputs.minor}}
                      ghcr.io/${{ github.repository }}:v${{needs.release_please.outputs.major}}
