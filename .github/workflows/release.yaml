on:
    push:
        branches:
            - master

    # Fires when the drafted release is published, which upload.sh does as its last step once
    # the binaries are built, signed, notarized and uploaded. Nothing else can raise it: draft
    # releases emit no event at all, and an event raised inside Actions by GITHUB_TOKEN never
    # triggers another workflow run. So this only ever comes from the manual publish that ends
    # a release - which is exactly the ordering guarantee we want.
    release:
        types: [published]

permissions:
    contents: write
    pull-requests: write
    packages: write
    attestations: write
    id-token: write

name: Manage Release
jobs:
    release_please:
        name: Create or prepare release
        runs-on: ubuntu-latest
        if: github.event_name == 'push'
        outputs:
            major: ${{ steps.release.outputs.major }}
            minor: ${{ steps.release.outputs.minor }}
            patch: ${{ steps.release.outputs.patch }}
            release_created: ${{ steps.release.outputs.release_created }}
        steps:
            # Configured through release-please-config.json (manifest mode) rather than a
            # `release-type` input here - the two are mutually exclusive, and only the config
            # file can set `draft`, which the action exposes no input for. The release is drafted
            # so users never see a version whose binaries do not exist yet, and `force-tag-creation`
            # makes the tag anyway: GitHub withholds the tag for a draft, and upload.sh builds
            # from the tag (falling back to HEAD behind an interactive prompt without it).
            - uses: googleapis/release-please-action@v4
              id: release

    publish:
        name: Publish NPM package
        runs-on: ubuntu-latest
        # Waits for the release to be published rather than firing when the release PR is merged.
        # An npm publish cannot practically be undone - unpublishing is limited to 72 hours and
        # breaks anyone who already installed it - so it should not happen until the release is
        # known to be complete. An abandoned draft now costs nothing; before, it burned a version.
        #
        # This job stays in this file deliberately. npm trusted publishing (OIDC, which is why
        # there is no token secret) is bound to the repository AND the workflow filename, so
        # moving it to its own workflow would fail authentication until the trusted publisher
        # config on npmjs.com was updated to match the new filename.
        #
        # To retry a failed publish, re-run this job from the Actions UI: that replays the same
        # release event, so it checks out the same tag with the same OIDC context.
        if: github.event_name == 'release' && !github.event.release.prerelease
        permissions:
            contents: read
            id-token: write
        steps:
            # On a release event the default ref is the release tag, so this publishes exactly
            # the commit that was released rather than whatever master has moved on to
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  registry-url: "https://registry.npmjs.org"
            - run: npm ci
            - run: npm publish --provenance --access public

    publish_docker:
        name: Publish Tagged Docker Image
        runs-on: ubuntu-latest
        needs: release_please
        # Deliberately still on the merge, not on the published release: a Docker tag can be
        # overwritten if a version is abandoned, unlike an npm publish, and holding the image
        # back would block users who have nothing to do with the macOS binaries.
        if: github.event_name == 'push' && needs.release_please.outputs.release_created
        # Multi-arch builds run the arm64 leg under QEMU emulation, which can
        # hang indefinitely on a misbehaving step. A normal build finishes in
        # ~4 minutes, so fail fast instead of burning the 6-hour default limit.
        timeout-minutes: 30
        steps:
            - run: echo version v${{needs.release_please.outputs.major}}.${{needs.release_please.outputs.minor}}.${{needs.release_please.outputs.patch}}

            - uses: actions/checkout@v6

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4
              with:
                  platforms: "arm64,arm"

            - name: Set up Docker Buildx
              id: buildx
              uses: docker/setup-buildx-action@v4
              with:
                  platforms: linux/amd64,linux/arm64/v8

            - name: Login to DockerHub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Login to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Build the amd64 image locally (no push) and smoke test the CLI BEFORE publishing, so a
            # broken image is never pushed to the tags users pull - the previous version smoke tested
            # the already-pushed image and could only detect the regression, not prevent shipping it.
            # This build replays from the same gha cache the multi-arch push below reuses.
            - name: Build for smoke test (amd64, local)
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: linux/amd64
                  load: true
                  tags: emailengine:smoke-test
                  cache-from: type=gha

            - name: Smoke test the CLI inside the image
              run: bash .github/docker-smoke-test.sh emailengine:smoke-test

            - name: Build and push
              id: build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: ${{ steps.buildx.outputs.platforms }}
                  push: true
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  tags: |
                      ${{ github.repository }}:latest
                      ${{ github.repository }}:v${{needs.release_please.outputs.major}}.${{needs.release_please.outputs.minor}}.${{needs.release_please.outputs.patch}}
                      ${{ github.repository }}:v${{needs.release_please.outputs.major}}.${{needs.release_please.outputs.minor}}
                      ${{ github.repository }}:v${{needs.release_please.outputs.major}}
                      ghcr.io/${{ github.repository }}:latest
                      ghcr.io/${{ github.repository }}:v${{needs.release_please.outputs.major}}.${{needs.release_please.outputs.minor}}.${{needs.release_please.outputs.patch}}
                      ghcr.io/${{ github.repository }}:v${{needs.release_please.outputs.major}}.${{needs.release_please.outputs.minor}}
                      ghcr.io/${{ github.repository }}:v${{needs.release_please.outputs.major}}
